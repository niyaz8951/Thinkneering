<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/global.css?v=6">
  <link rel="stylesheet" href="/assets/css/education.css?v=2">
  <link rel="stylesheet" href="/assets/css/dictionary.css?v=1">
  <title>Reader — Thinkneering</title>
</head>
<body>
  <a class="skip-link" href="#body">Skip to the text</a>
  <header data-site-header></header>

  <div class="read-progress" aria-hidden="true"><span id="progress"></span></div>

  <main id="main" class="wrap">
    <div class="reader" id="reader">
      <aside class="reader__toc" id="toc-panel">
        <p class="eyebrow" id="book-author">Reading</p>
        <h2 id="book-title">&nbsp;</h2>
        <p class="muted" id="book-sub" style="font-size:0.875rem"></p>

        <div class="field toc-filter" id="toc-filter-wrap" hidden>
          <label class="sr-only" for="toc-filter">Filter chapters</label>
          <input id="toc-filter" type="search" placeholder="Filter chapters" autocomplete="off">
        </div>

        <nav aria-label="Chapters"><ol id="toc"></ol></nav>
        <p class="muted toc-empty" id="toc-empty" hidden>No chapter matches that.</p>
      </aside>

      <div>
        <div class="reader__bar" role="toolbar" aria-label="Reading options">
          <button class="btn btn--quiet btn--sm" id="toc-toggle" aria-expanded="true"
                  aria-controls="toc-panel" title="Show or hide contents (T)">Contents</button>
          <span class="reader__bar-group">
            <button class="btn btn--quiet btn--sm" id="text-smaller" aria-label="Smaller text">A&minus;</button>
            <span class="chip" id="text-size">100%</span>
            <button class="btn btn--quiet btn--sm" id="text-bigger" aria-label="Larger text">A+</button>
          </span>
          <button class="btn btn--quiet btn--sm" id="width-toggle" title="Narrow or wide column">Width</button>
          <button class="btn btn--quiet btn--sm" id="fullscreen" title="Full screen (F)">Full screen</button>
        </div>

        <!-- data-dict-scope is what the AI Dictionary watches. Without it a
             tap or selection in the text is ignored, because the overlay
             deliberately does nothing outside a declared scope. The domain
             is set per book once the file is parsed. -->
        <article class="reader__body" id="body" tabindex="-1"
                 data-dict-scope data-dict-domain="general">
          <p class="muted" id="opening">Opening the book&hellip;</p>
        </article>
      </div>
    </div>
  </main>

  <div class="toc-scrim" id="toc-scrim" hidden></div>

  <footer data-site-footer></footer>
  <script src="/assets/js/global.js?v=6"></script>
  <script src="/assets/js/zip.js?v=2"></script>
  <script src="/assets/js/ebook.js?v=2"></script>
  <script src="/assets/js/dictionary.js?v=1" defer></script>
  <script>
  (function () {
    'use strict';

    var parts = location.pathname.replace(/^\/read\/?/, '').replace(/\/$/, '').split('/');
    var bookSlug = decodeURIComponent(parts[0] || '');
    var chapterSlug = decodeURIComponent(parts[1] || '');
    if (!bookSlug) { location.replace('/education/'); return; }

    var book = null;          // the parsed book, held for the whole visit
    var entry = null;         // its library card
    var bySlug = {};

    // --------------------------------------------------- reading options
    var prefs = { size: 100, wide: false, toc: true };
    try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem('tn-reader') || '{}')); } catch (e) {}

    function savePrefs() {
      try { localStorage.setItem('tn-reader', JSON.stringify(prefs)); } catch (e) {}
    }
    function isNarrow() { return window.matchMedia('(max-width: 900px)').matches; }

    function applyPrefs() {
      TN.el('#body').style.fontSize = (prefs.size / 100 * 1.0625).toFixed(3) + 'rem';
      TN.el('#text-size').textContent = prefs.size + '%';
      TN.el('#reader').classList.toggle('reader--wide', prefs.wide);
      TN.el('#reader').classList.toggle('reader--no-toc', !prefs.toc);
      TN.el('#toc-toggle').setAttribute('aria-expanded', String(prefs.toc));
      // On a phone the contents is a drawer over the text, so the page behind
      // it must not scroll away underneath.
      var drawerOpen = prefs.toc && isNarrow();
      TN.el('#toc-scrim').hidden = !drawerOpen;
      document.body.classList.toggle('toc-open', drawerOpen);
    }
    function resize(step) {
      prefs.size = Math.min(160, Math.max(80, prefs.size + step));
      savePrefs(); applyPrefs();
    }
    function toggleToc() { prefs.toc = !prefs.toc; savePrefs(); applyPrefs(); }

    TN.el('#text-bigger').addEventListener('click', function () { resize(10); });
    TN.el('#text-smaller').addEventListener('click', function () { resize(-10); });
    TN.el('#width-toggle').addEventListener('click', function () {
      prefs.wide = !prefs.wide; savePrefs(); applyPrefs();
    });
    TN.el('#toc-toggle').addEventListener('click', toggleToc);
    TN.el('#toc-scrim').addEventListener('click', toggleToc);

    // A phone that lands with contents remembered open would hide the text,
    // so the drawer starts closed on a narrow screen whatever was saved.
    if (isNarrow()) prefs.toc = false;

    // ------------------------------------------------------- full screen
    var fsBtn = TN.el('#fullscreen');
    function toggleFullscreen() {
      if (document.fullscreenElement) { document.exitFullscreen(); return; }
      var target = document.documentElement;
      if (target.requestFullscreen) {
        target.requestFullscreen().catch(function () {
          document.body.classList.add('is-reading');
          fsBtn.textContent = 'Exit full screen';
        });
      } else {
        document.body.classList.toggle('is-reading');
        fsBtn.textContent = document.body.classList.contains('is-reading') ? 'Exit full screen' : 'Full screen';
      }
    }
    fsBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', function () {
      var on = !!document.fullscreenElement;
      document.body.classList.toggle('is-reading', on);
      fsBtn.textContent = on ? 'Exit full screen' : 'Full screen';
    });

    // ---------------------------------------------------- reading position
    // Two copies on purpose. localStorage is instant and survives being
    // offline; the server copy follows the account to another device.
    // Whichever was written last wins when they disagree.
    var posKey = 'tn-pos:' + bookSlug;
    var lastPushed = 0, pushTimer = null;

    function localPos() {
      try { return JSON.parse(localStorage.getItem(posKey) || 'null'); } catch (e) { return null; }
    }
    function pushProgress() {
      if (!chapterSlug) return;
      fetch('/api/content/progress', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ book: bookSlug, chapter: chapterSlug, y: Math.round(window.scrollY) })
      }).catch(function () { /* offline — the local copy stands */ });
    }
    function saveProgress() {
      var doc = document.documentElement;
      var max = doc.scrollHeight - doc.clientHeight;
      var pct = max > 0 ? Math.min(1, doc.scrollTop / max) : 0;
      TN.el('#progress').style.width = (pct * 100).toFixed(1) + '%';
      if (!chapterSlug) return;

      try {
        localStorage.setItem(posKey, JSON.stringify({
          chapter: chapterSlug, y: doc.scrollTop, at: Date.now()
        }));
      } catch (e) {}

      // Scroll fires constantly; the server only needs a coarse position.
      if (pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(function () {
        if (Date.now() - lastPushed < 2000) return;
        lastPushed = Date.now();
        pushProgress();
      }, 2000);
    }
    window.addEventListener('scroll', saveProgress, { passive: true });
    window.addEventListener('pagehide', function () { if (chapterSlug) pushProgress(); });

    async function resumeChapter() {
      var local = localPos(), remote = null;
      try {
        var r = await TN.api('/api/content/progress?book=' + encodeURIComponent(bookSlug));
        if (r && r.chapter) remote = r;
      } catch (e) {}

      var pick = null;
      if (local && remote) {
        var localAt = local.at || 0;
        var remoteAt = remote.updated_at ? Date.parse(remote.updated_at) || 0 : 0;
        pick = remoteAt > localAt ? remote.chapter : local.chapter;
      } else {
        pick = (remote && remote.chapter) || (local && local.chapter) || null;
      }
      return pick && bySlug[pick] ? pick : null;
    }

    // ------------------------------------------------------------ contents
    function renderToc() {
      TN.el('#book-title').textContent = book.title;
      TN.el('#book-author').textContent = book.author || 'Reading';
      TN.el('#book-sub').textContent = book.subtitle || '';
      document.title = book.title + ' — Thinkneering';

      TN.el('#toc').innerHTML = book.chapters.map(function (c) {
        return '<li data-title="' + TN.esc(c.title.toLowerCase()) + '">' +
          '<a href="/read/' + encodeURIComponent(bookSlug) + '/' + encodeURIComponent(c.slug) + '"' +
          ' data-chapter="' + TN.esc(c.slug) + '"><span>' + TN.esc(c.title) + '</span></a></li>';
      }).join('');

      // A book with a hundred chapters needs a way to reach one without
      // scrolling the whole list.
      if (book.chapters.length > 12) TN.el('#toc-filter-wrap').hidden = false;
    }

    TN.el('#toc-filter').addEventListener('input', function () {
      var q = this.value.trim().toLowerCase();
      var shown = 0;
      TN.els('#toc li').forEach(function (li) {
        var hit = !q || li.getAttribute('data-title').indexOf(q) >= 0;
        li.hidden = !hit;
        if (hit) shown++;
      });
      TN.el('#toc-empty').hidden = shown > 0;
    });

    function markCurrent() {
      TN.els('#toc a').forEach(function (a) {
        if (a.getAttribute('data-chapter') === chapterSlug) a.setAttribute('aria-current', 'true');
        else a.removeAttribute('aria-current');
      });
      var on = TN.el('#toc a[aria-current="true"]');
      if (on && !isNarrow()) on.scrollIntoView({ block: 'nearest' });
    }

    function chapterNav() {
      var i = book.chapters.findIndex(function (c) { return c.slug === chapterSlug; });
      var prev = book.chapters[i - 1], next = book.chapters[i + 1];
      var link = function (c, label) {
        return '<a class="btn btn--ghost" href="/read/' + encodeURIComponent(bookSlug) + '/' +
          encodeURIComponent(c.slug) + '" data-chapter="' + TN.esc(c.slug) + '">' + label + '</a>';
      };
      return '<nav class="reader__nav">' +
        (prev ? link(prev, '&larr; ' + TN.esc(prev.title)) : '<span></span>') +
        (next ? link(next, TN.esc(next.title) + ' &rarr;') : '<span></span>') +
        '</nav>';
    }

    // ------------------------------------------------------------ display
    // Chapters are swapped in place rather than by loading a new page: the
    // book was parsed once and re-parsing a hundred chapters to turn one page
    // would make every tap cost seconds.
    function showChapter(slug, restoreY) {
      var c = bySlug[slug];
      if (!c) return;
      chapterSlug = slug;

      TN.el('#body').innerHTML = '<h1>' + TN.esc(c.title) + '</h1>' + c.html + chapterNav();
      markCurrent();
      if (isNarrow() && prefs.toc) { prefs.toc = false; applyPrefs(); }

      window.scrollTo(0, restoreY > 0 ? restoreY : 0);
      saveProgress();

      // The dictionary warms its cache per chapter and files lookups under
      // the book being read. It listens for this and nothing else fires it,
      // so a chapter rendered without it gets no prefetch and no history.
      document.dispatchEvent(new CustomEvent('tn:chapter', {
        detail: { book: bookSlug, chapter: slug, title: c.title }
      }));
    }

    function navigate(slug, push) {
      if (push) history.pushState({ chapter: slug }, '', '/read/' + encodeURIComponent(bookSlug) + '/' + encodeURIComponent(slug));
      showChapter(slug, 0);
      TN.el('#body').focus();
    }

    document.addEventListener('click', function (ev) {
      var a = ev.target.closest ? ev.target.closest('a[data-chapter]') : null;
      if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
      ev.preventDefault();
      navigate(a.getAttribute('data-chapter'), true);
    });

    window.addEventListener('popstate', function () {
      var p = location.pathname.replace(/^\/read\/?/, '').replace(/\/$/, '').split('/');
      var slug = decodeURIComponent(p[1] || '');
      if (slug && bySlug[slug]) showChapter(slug, 0);
    });

    function go(dir) {
      if (!book || !chapterSlug) return;
      var i = book.chapters.findIndex(function (c) { return c.slug === chapterSlug; });
      var next = book.chapters[i + dir];
      if (next) navigate(next.slug, true);
    }

    document.addEventListener('keydown', function (ev) {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName) || ev.metaKey || ev.ctrlKey) return;
      if (ev.key === 'ArrowRight' || ev.key === 'n') go(1);
      else if (ev.key === 'ArrowLeft' || ev.key === 'p') go(-1);
      else if (ev.key === 'f') toggleFullscreen();
      else if (ev.key === '+' || ev.key === '=') resize(10);
      else if (ev.key === '-') resize(-10);
      else if (ev.key === 't') toggleToc();
    });

    function fail(title, message, action) {
      TN.el('#body').innerHTML = '<div class="paywall">' +
        '<span class="chip chip--auth">' + TN.icon('lock', 12) + ' Closed</span>' +
        '<h2 style="margin-top:var(--space-2)">' + TN.esc(title) + '</h2>' +
        '<p class="muted" style="margin-top:var(--space-2)">' + TN.esc(message) + '</p>' +
        '<div class="hero__actions" style="justify-content:center">' + (action || '') + '</div></div>';
    }

    // --------------------------------------------------------------- load
    (async function () {
      var status = TN.el('#opening');
      try {
        var lib = await TN.api('/api/education/library');

        if (!lib.allowed) {
          fail('Education is closed to this account', lib.message,
            lib.reason === 'signin'
              ? '<a class="btn btn--primary" href="/login/?next=' + encodeURIComponent(location.pathname) + '">Sign in</a>'
              : '<a class="btn btn--ghost" href="/">Back to home</a>');
          return;
        }

        entry = (lib.books || []).find(function (b) { return b.slug === bookSlug; });
        if (!entry) { fail('No such book', 'That book is not in the library.',
          '<a class="btn btn--ghost" href="/education/">Back to the library</a>'); return; }

        TN.el('#book-title').textContent = entry.title;
        TN.el('#book-author').textContent = entry.author || 'Reading';
        status.textContent = 'Downloading ' + entry.title + '\u2026';

        var res = await fetch('/api/education/file/' + encodeURIComponent(bookSlug), { credentials: 'same-origin' });
        if (!res.ok) {
          var why = await res.json().catch(function () { return {}; });
          throw new Error(why.error || 'That book could not be downloaded.');
        }
        var buffer = await res.arrayBuffer();

        var kind = entry.format === 'epub' ? 'EPUB' : entry.format === 'txt' ? 'text file' : 'Word document';
        status.textContent = 'Reading the ' + kind + '\u2026';
        book = await TNEbook.read(buffer, entry.format);

        // The library card is the label the site chose; prefer it over the
        // file's own title so a card and the page it opens agree.
        // The dictionary answers differently per domain — "casing" in an HVAC
        // book is not "casing" in a novel. The shelf carries the domain when
        // one was chosen at upload; otherwise every book stays general.
        if (entry.domain) TN.el('#body').setAttribute('data-dict-domain', entry.domain);

        if (entry.title) book.title = entry.title;
        if (entry.subtitle) book.subtitle = entry.subtitle;
        if (entry.author) book.author = entry.author;

        book.chapters.forEach(function (c) { bySlug[c.slug] = c; });
        if (!book.chapters.length) { fail('Nothing to read', 'That file had no readable chapters.', ''); return; }

        renderToc();
        applyPrefs();

        // /read/<book> with no chapter means "open this book", not a landing
        // page: resolve where reading stopped and go straight there.
        if (!chapterSlug || !bySlug[chapterSlug]) {
          var target = (await resumeChapter()) || book.chapters[0].slug;
          var pos = localPos();
          var y = pos && pos.chapter === target ? pos.y : 0;
          // replace, not push: Back should return to the library, not bounce
          // through this resolver again.
          history.replaceState({ chapter: target }, '',
            '/read/' + encodeURIComponent(bookSlug) + '/' + encodeURIComponent(target));
          showChapter(target, y);
          return;
        }

        var saved = localPos();
        showChapter(chapterSlug, saved && saved.chapter === chapterSlug ? saved.y : 0);
      } catch (err) {
        fail('That book would not open', err.message,
          '<a class="btn btn--ghost" href="/education/">Back to the library</a>');
      }
    })();
  })();
  </script>
</body>
</html>
