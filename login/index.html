<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/global.css?v=11">
  <title>Sign in — Thinkneering</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="auth-wrap">
    <div class="panel">
      <h1 style="font-size:1.5rem">Sign in</h1>
      <p class="muted" style="margin-top:var(--space-2)">Thinkneering is an account-only site.</p>
      <div id="notice" hidden style="margin-top:var(--space-3)"></div>
      <div id="error" hidden style="margin-top:var(--space-3)"></div>
      <form id="form" style="margin-top:var(--space-4)" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary btn--block" style="margin-top:var(--space-4)" type="submit">Sign in</button>
      </form>
      <p class="hint" style="margin-top:var(--space-4)">No account yet? <a href="/signup/">Create one</a>.</p>
    </div>
  </main>
  <script src="/assets/js/global.js?v=11"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var next = params.get('next') || '/';

    // Only ever return to a path on this site. `next` arrives in the URL, so
    // without this check a crafted link could bounce someone to another origin
    // straight after they typed their password.
    if (!/^\/[^/\\]/.test(next)) next = '/';

    // One account, one live session. Signing in elsewhere ends this one, and
    // the displaced device should be told why rather than left guessing.
    if (params.get('next') && params.get('next') !== '/') {
      var notice = TN.el('#notice');
      notice.hidden = false;
      notice.className = 'notice';
      notice.innerHTML = '<div>Sign in to continue. If you were signed in a moment ago, ' +
        'this account was opened on another device — only one is allowed at a time.</div>';
    }
    TN.el('#form').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var box = TN.el('#error'); box.hidden = true;
      try {
        await TN.api('/api/auth/login', { method: 'POST', body: {
          email: TN.el('#email').value, password: TN.el('#password').value } });
        location.href = next;
      } catch (err) {
        box.hidden = false;
        box.className = 'notice notice--danger';
        box.innerHTML = '<div>' + TN.esc(err.message) + '</div>';
      }
    });
  </script>
</body>
</html>
