<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/global.css?v=6">
  <title>Create an account — Thinkneering</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-site-header></header>
  <main id="main" class="auth-wrap">
    <div class="panel">
      <h1 style="font-size:1.5rem">Create an account</h1>
      <p class="muted" style="margin-top:var(--space-2)">Unlocks AI review, saved projects and everything an admin grants you.</p>
      <div id="error" hidden style="margin-top:var(--space-3)"></div>
      <form id="form" style="margin-top:var(--space-4)" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password"
                 minlength="8" required aria-describedby="password-hint">
          <p class="hint" id="password-hint">At least 8 characters.</p>
        </div>
        <div class="field">
          <label for="password2">Confirm password</label>
          <input id="password2" name="password2" type="password" autocomplete="new-password"
                 minlength="8" required aria-describedby="password2-hint">
          <p class="hint" id="password2-hint">Type it again so a typo cannot lock you out.</p>
        </div>
        <button class="btn btn--primary btn--block" style="margin-top:var(--space-4)" type="submit">Create account</button>
      </form>
      <p class="hint" style="margin-top:var(--space-4)">Already registered? <a href="/login/">Sign in</a>.</p>
    </div>
  </main>
  <footer data-site-footer></footer>
  <script src="/assets/js/global.js?v=6"></script>
  <script>
    var next = new URLSearchParams(location.search).get('next') || '/';
    var pw = TN.el('#password');
    var pw2 = TN.el('#password2');
    var hint2 = TN.el('#password2-hint');

    // Say it as soon as the two disagree, not after the form is sent back.
    function checkMatch(quiet) {
      var mismatch = pw2.value.length > 0 && pw.value !== pw2.value;
      pw2.setAttribute('aria-invalid', mismatch ? 'true' : 'false');
      if (mismatch) hint2.textContent = 'The two passwords do not match.';
      else if (!quiet) hint2.textContent = 'Type it again so a typo cannot lock you out.';
      return !mismatch;
    }
    pw2.addEventListener('input', function () { checkMatch(false); });
    pw.addEventListener('input', function () { if (pw2.value) checkMatch(false); });

    TN.el('#form').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var box = TN.el('#error'); box.hidden = true;

      function stop(message, focus) {
        box.hidden = false;
        box.className = 'notice notice--danger';
        box.innerHTML = '<div>' + TN.esc(message) + '</div>';
        if (focus) focus.focus();
      }

      if (pw.value.length < 8) return stop('Use at least 8 characters for your password.', pw);
      if (pw.value !== pw2.value) { checkMatch(false); return stop('The two passwords do not match.', pw2); }

      try {
        var res = await TN.api('/api/auth/signup', { method: 'POST', body: {
          name: TN.el('#name').value, email: TN.el('#email').value, password: pw.value } });
        if (res.status === 'pending') {
          box.hidden = false; box.className = 'notice notice--success';
          box.innerHTML = '<div>' + TN.esc(res.message) + '</div>';
          TN.el('#form').reset();
          return;
        }
        location.href = next;
      } catch (err) {
        stop(err.message);
      }
    });
  </script>
</body>
</html>
