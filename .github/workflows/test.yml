# Every push runs every suite.
#
# The suites are what let this codebase be changed safely in two years by
# someone with no memory of why any of it is the way it is. That only holds if
# a broken change is caught before it is deployed rather than after, which is
# what this file is for.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Two suites are Python: the schema harness applies every migration to a
      # scratch SQLite database, which is the only honest way to test SQL.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm test
