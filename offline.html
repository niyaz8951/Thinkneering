<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0f13">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thinkneering">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f13">
  <link rel="stylesheet" href="/assets/css/global.css?v=20">
  <title>Offline — Thinkneering</title>
</head>
<body>
  <!-- Deliberately contains nothing about the account or its work. The service
       worker caches this file, and a cache outlives the session that filled
       it — anything personal here would still be readable after sign-out. -->
  <main class="auth-landing">
    <div class="auth-landing__copy">
      <p class="eyebrow">No connection</p>
      <h1>You're <em>offline</em>.</h1>
      <p>
        Thinkneering needs a connection: your knowledge graph and your answers live on
        the server, not on this device. Reconnect and the page you wanted will load.
      </p>
      <div class="hero__actions">
        <button class="btn btn--primary" onclick="location.reload()">Try again</button>
      </div>
    </div>
  </main>
</body>
</html>
