<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0f13">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thinkneering">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/global.css?v=22">
  <title>Section — Thinkneering</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-site-header></header>
  <main id="main" class="wrap">
    <div class="page-head">
      <p class="eyebrow" id="crumb">Loading</p>
      <h1 id="title">&nbsp;</h1>
      <p id="desc"></p>
    </div>
    <div id="locked" hidden></div>
    <section id="subsections-block" hidden class="section-block">
      <div class="section-block__head"><h2>Subsections</h2></div>
      <div id="subsections" class="grid"></div>
    </section>
    <section id="items-block" hidden class="section-block">
      <div class="section-block__head"><h2>In this section</h2></div>
      <div id="items" class="grid"></div>
    </section>
  </main>
  <footer data-site-footer></footer>
  <script src="/assets/js/global.js?v=22"></script>
  <script src="/assets/js/pwa.js?v=1"></script>
  <script>
    (async function () {
      /* Only strip /s when the URL really is /s/... — the old expression
         matched any path beginning with "s" and turned /section into
         "ection", which is precisely the nonsense it then went looking for.
         A wrong answer from a sloppy regex is worse than an error, because it
         sends you hunting in the data rather than in the routing. */
      var m = location.pathname.match(/^\/s(?:\/(.*))?$/);
      if (!m) {
        TN.el('#title').textContent = 'Wrong address';
        TN.el('#desc').innerHTML = 'This page is served at <code>' +
          TN.esc(location.pathname) + '</code>, but it can only work under ' +
          '<code>/s/&lt;section&gt;</code>. The rewrite in <code>_redirects</code> ' +
          'is sending the wrong URL here.';
        return;
      }
      var path = (m[1] || '').replace(/\/$/, '');

      // Sections that are really a single destination. Listing one item and
      // making the reader click it is a hop that earns nothing, so these
      // resolve straight through. `education/humonks` is kept here after the
      // sub-section was removed, so old links and bookmarks still land.
      // Education is no longer a catalogue of database-backed books: it is a
      // folder of .docx and .epub files with its own library page. These keep
      // old links and bookmarks landing somewhere sensible.
      // Both the current slugs and the ones they replaced. The old keys are
      // not dead weight: _redirects matches /s/* before it reaches the 301s,
      // so an old link arrives here with its original path and would
      // otherwise resolve to nothing.
      var directRoutes = {
        "maps": "/tools/knowledge/",
        "knowledge": "/tools/knowledge/",
        "compliance-maker": "/tools/compliance-maker/",
        "library": "/education/",
        "education": "/education/",
        "library/humonks": "/read/humonks",
        "education/humonks": "/read/humonks",
        "library/ncert": "/read/ncert-english",
        "education/ncert": "/read/ncert-english"
      };

      if (directRoutes[path]) {
        location.replace(directRoutes[path]);
        return;
      }


      if (!path) {
        TN.el('#title').textContent = 'No section named';
        TN.el('#desc').textContent = 'That link had no section in it. Use the nav above.';
        return;
      }
      try {
        var d = await TN.api('/api/catalog?path=' + encodeURIComponent(path));
        document.title = d.section.title + ' — Thinkneering';
        TN.el('#crumb').textContent = d.breadcrumb.map(function (b) { return b.title; }).join('  /  ');
        TN.el('#title').textContent = d.section.title;
        TN.el('#desc').textContent = d.section.description || d.section.tagline || '';

        if (!d.section.allowed) {
          var box = TN.el('#locked');
          box.hidden = false;
          box.className = 'paywall';
          box.innerHTML = TN.accessChip(d.section) +
            '<h2 style="margin-top:var(--space-2)">This section needs an account</h2>' +
            '<p class="muted" style="margin-top:var(--space-2)">Sign in to open it, or head back to the free sections.</p>' +
            '<div class="hero__actions" style="justify-content:center">' +
            '<a class="btn btn--primary" href="/login/?next=' + encodeURIComponent(location.pathname) + '">Sign in</a>' +
            '<a class="btn btn--ghost" href="/">Back to home</a></div>';
          return;
        }
        var base = location.pathname.replace(/\/$/, '');
        if (d.children.length) {
          TN.el('#subsections-block').hidden = false;
          TN.el('#subsections').innerHTML = d.children.map(function (c) {
            return '<a class="card' + (c.allowed ? '' : ' card--locked') + '" href="' + base + '/' + TN.esc(c.slug) + '">' +
              '<span class="card__icon">' + TN.icon(c.icon, 20) + '</span>' +
              '<span class="card__title">' + TN.esc(c.title) + '</span>' +
              '<span class="card__desc">' + TN.esc(c.description || c.tagline || '') + '</span>' +
              '<span class="card__foot">' + TN.accessChip(c) + '</span></a>';
          }).join('');
        }
        if (d.items.length) {
          TN.el('#items-block').hidden = false;
          TN.renderCards('#items', d.items);
        } else if (!d.children.length) {
          TN.el('#items-block').hidden = false;
          TN.el('#items').innerHTML = '<div class="empty">Nothing published here yet. Check back soon.</div>';
        }
      } catch (err) {
        /* "That section does not exist" on its own tells you nothing you can
           act on. Ask the catalogue what it does have and say so: the slug
           that was looked for, beside the slugs that exist, is usually the
           whole diagnosis — a rename that has not been applied, or a link
           built from a stale slug. */
        TN.el('#title').textContent = 'Section not found';
        TN.el('#desc').textContent = err.message;

        try {
          var all = await TN.api('/api/catalog');
          var slugs = (all.sections || []).map(function (x) { return x.slug; });
          TN.el('#desc').innerHTML = TN.esc(err.message) +
            '<br>Looked for <code>' + TN.esc(path) + '</code>. ' +
            (slugs.length
              ? 'This site has: ' + slugs.map(function (x) {
                  return '<a href="/s/' + TN.esc(x) + '"><code>' + TN.esc(x) + '</code></a>';
                }).join(', ')
              : 'The catalogue returned no sections at all.');
        } catch (e2) {
          TN.el('#desc').textContent = err.message +
            ' The catalogue could not be read either: ' + e2.message;
        }
      }
    })();
  </script>
</body>
</html>
