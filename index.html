<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0f13">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thinkneering">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/global.css?v=22">
  <title>Thinkneering — compliance answers you can stand behind</title>
  <meta name="description" content="Turn a specification into a compliance matrix, answered from engineering knowledge you have reviewed and approved. Sign in required.">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-site-header></header>

  <main id="main">
    <section class="wrap hero" id="hero" aria-live="polite"></section>

    <!-- The desk. A knowledge base is a deposit system: you put in today and
         get out in eight months, and nobody sustains that on discipline. The
         home page is therefore the place you ASK it something, because a
         graph that visibly pays you back is the only kind anyone keeps
         filling. -->
    <section class="wrap desk">
      <form id="ask-form" class="desk__ask" role="search">
        <label class="sr-only" for="ask">Ask your approved knowledge</label>
        <input type="search" id="ask" autocomplete="off" enterkeyhint="search"
               placeholder="Have we done ATEX on a Saudi job?">
        <button class="btn btn--primary" type="submit" id="ask-go">Ask</button>
      </form>
      <p class="hint">Answers come from approved nodes only, and say when nothing covers it.</p>

      <div id="ask-out" hidden></div>

      <div class="desk__queues" id="desk-queues"></div>

      <!-- Your maps, with what is outstanding on each. A count on the desk is
           a prompt; a count you have to open three pages to find is not. -->
      <div class="desk__maps" id="desk-maps"></div>

      <!-- What is actually waiting on you, not just how many. A queue you can
           see the top of is a queue you start. -->
      <div class="desk__next" id="desk-next"></div>
    </section>

    <section class="wrap" id="feature"></section>

    <section class="wrap section-block">
      <div class="section-block__head">
        <div>
          <p class="eyebrow">Index</p>
          <h2>Everything on the site</h2>
        </div>
      </div>
      <div class="index-list" id="sections" aria-busy="true"></div>
    </section>
  </main>

  <footer data-site-footer></footer>
  <script src="/assets/js/global.js?v=22"></script>
  <script src="/assets/js/pwa.js?v=1"></script>
  <script>
  (function () {
    'use strict';
    var esc = TN.esc, icon = TN.icon;

    // Find the most recent book position the reader saved, so a returning
    // reader gets one click back into the text.
    function lastRead() {
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('tn-pos:') === 0) {
            var v = JSON.parse(localStorage.getItem(k) || 'null');
            if (v && v.chapter) return { book: k.slice(7), chapter: v.chapter };
          }
        }
      } catch (e) {}
      return null;
    }

    function heroSignedIn(user) {
      var first = (user.name || user.email).split(/[\s@]/)[0];
      var reading = lastRead();
      var hour = new Date().getHours();
      var greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

      var actions = ['<a class="btn btn--primary" href="/tools/compliance-maker/">Open Compliance Maker</a>',
        '<a class="btn btn--ghost" href="/tools/knowledge/review.html">' + icon('check', 18) + ' Review queue</a>'];
      if (reading) {
        actions.push('<a class="btn btn--ghost" href="/read/' + esc(reading.book) + '/' + esc(reading.chapter) + '">' +
          icon('book-open', 18) + ' Continue reading</a>');
      }
      if (user.role === 'admin') {
        actions.push('<a class="btn btn--ghost" href="/admin/">' + icon('settings', 18) + ' Admin</a>');
      }

      return '<p class="eyebrow">' + esc(user.plan) + ' &middot; ' + esc(user.role) + '</p>' +
        '<h1>' + esc(greet) + ', <em>' + esc(first) + '</em>.</h1>' +
        '<div class="hero__actions">' + actions.join('') + '</div>';
    }

    /* ── The desk ──────────────────────────────────────────────────────
       Ask first, queues second. The ask box is the habit: a graph that
       answers you today is one you keep filling, and a graph you only fill
       is one you stop opening.
       ---------------------------------------------------------------- */

    function askOut(html, kind) {
      var box = TN.el('#ask-out');
      box.hidden = false;
      box.className = 'desk__answer' + (kind ? ' is-' + kind : '');
      box.innerHTML = html;
    }

    async function askGraph(question) {
      var go = TN.el('#ask-go');
      go.disabled = true;
      askOut('<p class="muted">Looking through what you have approved…</p>');

      try {
        var d = await TN.api('/api/knowledge/ask', {
          method: 'POST',
          body: { question: question }
        });

        // Nothing approved covers it. This is a real answer, not a failure —
        // and the terms it did not recognise are the useful part, because
        // they name exactly what is worth writing down next.
        if (!d.grounded) {
          askOut('<p><strong>Nothing approved covers this yet.</strong></p>' +
            (d.gaps && d.gaps.length
              ? '<p class="muted">Not recognised: ' + esc(d.gaps.join(', ')) + '</p>'
              : '') +
            '<p class="hint"><a href="/tools/knowledge/">Add it to a map</a> and it will answer ' +
            'next time.</p>', 'empty');
          return;
        }

        var html = d.answer
          ? '<p>' + esc(d.answer).replace(/\n+/g, '</p><p>') + '</p>'
          : '';

        if (!d.answer && d.matches) {
          html += '<p class="muted">' + (d.note ? esc(d.note) : 'Matching nodes:') + '</p><ul>' +
            d.matches.map(function (m) {
              return '<li>' + esc(m.title) + ' <span class="muted">(' + esc(m.kind) + ')</span></li>';
            }).join('') + '</ul>';
        }

        if (d.note && d.answer) {
          html += '<p class="desk__note">' + esc(d.note) + '</p>';
        }

        // Citations are the whole point: an answer you cannot trace is an
        // answer you cannot repeat to a consultant.
        if (d.citations && d.citations.length) {
          html += '<p class="hint">From ' + d.citations.map(function (c) {
            return '<a href="/tools/knowledge/map.html?map=' + encodeURIComponent(c.mapId) +
              '">' + esc(c.title) + '</a>' +
              (c.scope === 'project' ? ' <span class="muted">(one project)</span>' : '');
          }).join(', ') + '</p>';
        }

        if (d.gaps && d.gaps.length) {
          html += '<p class="hint">Not recognised: ' + esc(d.gaps.join(', ')) + '</p>';
        }

        askOut(html, d.conflicts && d.conflicts.length ? 'conflict' : '');
      } catch (err) {
        askOut('<p>' + esc(err.message) + '</p>', 'error');
      } finally {
        go.disabled = false;
      }
    }

    TN.el('#ask-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var q = TN.el('#ask').value.trim();
      if (q) askGraph(q);
    });

    /* Two counts and nothing else. A desk that lists everything outstanding
       is a desk nobody clears; one that shows what is waiting and what is
       late is one you can finish. */
    async function loadQueues() {
      var tiles = [];

      try {
        var r = await TN.api('/api/knowledge/review');
        tiles.push(tile('check', r.remaining || 0,
          r.remaining === 1 ? 'node waiting for review' : 'nodes waiting for review',
          '/tools/knowledge/review.html'));
      } catch (e) { /* no review rights: no tile */ }

      try {
        var a = await TN.api('/api/knowledge/actions');
        tiles.push(tile('activity', a.open || 0,
          a.overdue ? a.overdue + ' of them overdue' : 'open actions',
          '/tools/knowledge/'));
      } catch (e) { /* no maps yet */ }

      TN.el('#desk-queues').innerHTML = tiles.join('');
    }

    /* The maps you can open, each with its draft count and a direct link to
       the hierarchy view — which is where the structure actually reads, and
       which nobody finds if the only route is a picker three clicks in. */
    async function loadMaps() {
      try {
        var d = await TN.api('/api/knowledge/graph');
        var maps = (d && d.maps) || [];
        if (!maps.length) return;

        TN.el('#desk-maps').innerHTML =
          '<h2 class="desk__h">Your maps</h2><div class="desk__maprow">' +
          maps.map(function (m) {
            var pending = (m.node_count || 0) - (m.approved_count || 0);
            return '<a class="desk__map" href="/tools/knowledge/map.html?map=' +
              encodeURIComponent(m.id) + '">' +
              '<span class="desk__map-title">' + esc(m.title) + '</span>' +
              '<span class="desk__map-meta">' + (m.approved_count || 0) + ' approved' +
              (pending > 0 ? ' · ' + pending + ' draft' : '') + '</span></a>';
          }).join('') + '</div>';
      } catch (e) { /* no maps, or no access: the row simply does not appear */ }
    }

    /* The top of the review queue, in full. Seeing the actual node is what
       turns "121 waiting" from a number you ignore into one decision you can
       make in ten seconds. */
    async function loadNext() {
      try {
        var d = await TN.api('/api/knowledge/review');
        if (!d.next) return;
        var n = d.next;

        TN.el('#desk-next').innerHTML =
          '<h2 class="desk__h">Next for review</h2>' +
          '<a class="desk__nextcard" href="/tools/knowledge/review.html">' +
          '<span class="eyebrow">' + esc(n.mapTitle || '') + ' · ' + esc(n.kind) + '</span>' +
          '<span class="desk__nexttitle">' + esc(n.title) + '</span>' +
          (n.summary ? '<span class="muted">' + esc(n.summary) + '</span>' : '') +
          '<span class="hint">' +
          (n.draftFacts ? n.draftFacts + ' proposed fact' + (n.draftFacts === 1 ? '' : 's') : 'No facts yet') +
          (n.similar && n.similar.length ? ' · ' + n.similar.length + ' similar already held' : '') +
          '</span></a>';
      } catch (e) { /* no review rights */ }
    }

    function tile(ic, n, label, href) {
      return '<a class="desk__tile' + (n ? '' : ' is-clear') + '" href="' + href + '">' +
        icon(ic, 20) +
        '<span class="desk__n">' + n + '</span>' +
        '<span class="desk__label">' + esc(label) + '</span></a>';
    }

    // The Compliance Maker is the flagship, so it gets a real feature block
    // rather than an identical card in a grid of four.
    function featureHTML() {
      var steps = [['01', 'Upload', 'A specification PDF, or paste the text'],
                   ['02', 'Extract', 'Clauses numbered and split into rows'],
                   ['03', 'Answer', 'Drawn from approved knowledge, with citations'],
                   ['04', 'Export', 'A formatted Excel matrix, ready to send']];
      return '<div class="feature">' +
        '<div class="feature__body">' +
        '<p class="eyebrow">Flagship</p>' +
        '<h2>Compliance Maker</h2>' +
        '<p class="muted">Drop in a specification and get back a numbered compliance matrix with the ' +
        'formatting already done. Where your knowledge graph can answer a clause, it does — and says ' +
        'which approved node the answer came from. Where it cannot, it says so and raises the gap ' +
        'for review rather than inventing a number.</p>' +
        '<div class="hero__actions">' +
        '<a class="btn btn--primary" href="/tools/compliance-maker/">Convert a spec</a>' +
        '</div></div>' +
        '<ol class="steps">' + steps.map(function (s) {
          return '<li><span class="steps__n">' + s[0] + '</span>' +
            '<span class="steps__t">' + esc(s[1]) + '</span>' +
            '<span class="steps__d">' + esc(s[2]) + '</span></li>';
        }).join('') + '</ol></div>';
    }

    function indexHTML(sections) {
      if (!sections.length) return '<div class="empty">No sections are published yet.</div>';
      return sections.map(function (s, i) {
        var n = String(i + 1).padStart(2, '0');
        return '<a class="index-row' + (s.allowed ? '' : ' index-row--locked') + '" href="/s/' + esc(s.slug) + '">' +
          '<span class="index-row__n">' + n + '</span>' +
          '<span class="index-row__main">' +
          '<span class="index-row__title">' + esc(s.title) + '</span>' +
          '<span class="index-row__desc">' + esc(s.description || s.tagline || '') + '</span>' +
          '</span>' +
          '<span class="index-row__meta">' + TN.accessChip(s) + '</span>' +
          '<span class="index-row__go" aria-hidden="true">' + icon('repeat', 18) + '</span>' +
          '</a>';
      }).join('');
    }

    document.addEventListener('tn:ready', function (e) {
      var user = e.detail.user;
      // Middleware redirects a signed-out visitor to /login/, so reaching
      // this page without a user means the session ended between the request
      // and the catalogue call. Send them on rather than rendering an empty
      // shell whose every button will 401.
      if (!user) {
        location.replace('/login/?next=' + encodeURIComponent(location.pathname));
        return;
      }
      TN.el('#hero').innerHTML = heroSignedIn(user);
      TN.el('#feature').innerHTML = featureHTML();
      loadQueues();
      loadMaps();
      loadNext();
      var node = TN.el('#sections');
      node.removeAttribute('aria-busy');
      node.innerHTML = indexHTML(e.detail.sections || []);
    });
  })();
  </script>
</body>
</html>
