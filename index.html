<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0f13">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thinkneering">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/global.css?v=13">
  <title>Thinkneering — compliance answers you can stand behind</title>
  <meta name="description" content="Turn a specification into a compliance matrix, answered from engineering knowledge you have reviewed and approved. Sign in required.">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-site-header></header>

  <main id="main">
    <section class="wrap hero" id="hero" aria-live="polite"></section>

    <section class="wrap" id="feature"></section>

    <section class="wrap section-block">
      <div class="section-block__head">
        <div>
          <p class="eyebrow">Index</p>
          <h2>Everything on the site</h2>
        </div>
      </div>
      <div class="index-list" id="sections" aria-busy="true"></div>
    </section>
  </main>

  <footer data-site-footer></footer>
  <script src="/assets/js/global.js?v=13"></script>
  <script src="/assets/js/pwa.js?v=1"></script>
  <script>
  (function () {
    'use strict';
    var esc = TN.esc, icon = TN.icon;

    // Find the most recent book position the reader saved, so a returning
    // reader gets one click back into the text.
    function lastRead() {
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('tn-pos:') === 0) {
            var v = JSON.parse(localStorage.getItem(k) || 'null');
            if (v && v.chapter) return { book: k.slice(7), chapter: v.chapter };
          }
        }
      } catch (e) {}
      return null;
    }

    function heroSignedIn(user) {
      var first = (user.name || user.email).split(/[\s@]/)[0];
      var reading = lastRead();
      var hour = new Date().getHours();
      var greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

      var actions = ['<a class="btn btn--primary" href="/tools/compliance-maker/">Open Compliance Maker</a>',
        '<a class="btn btn--ghost" href="/tools/knowledge/review.html">' + icon('check', 18) + ' Review queue</a>'];
      if (reading) {
        actions.push('<a class="btn btn--ghost" href="/read/' + esc(reading.book) + '/' + esc(reading.chapter) + '">' +
          icon('book-open', 18) + ' Continue reading</a>');
      }
      if (user.role === 'admin') {
        actions.push('<a class="btn btn--ghost" href="/admin/">' + icon('settings', 18) + ' Admin</a>');
      }

      return '<p class="eyebrow">' + esc(user.plan) + ' &middot; ' + esc(user.role) + '</p>' +
        '<h1>' + esc(greet) + ', <em>' + esc(first) + '</em>.</h1>' +
        '<p class="hero__lede">Everything below is unlocked unless it carries a badge.</p>' +
        '<div class="hero__actions">' + actions.join('') + '</div>';
    }

    // The Compliance Maker is the flagship, so it gets a real feature block
    // rather than an identical card in a grid of four.
    function featureHTML() {
      var steps = [['01', 'Upload', 'A specification PDF, or paste the text'],
                   ['02', 'Extract', 'Clauses numbered and split into rows'],
                   ['03', 'Answer', 'Drawn from approved knowledge, with citations'],
                   ['04', 'Export', 'A formatted Excel matrix, ready to send']];
      return '<div class="feature">' +
        '<div class="feature__body">' +
        '<p class="eyebrow">Flagship</p>' +
        '<h2>Compliance Maker</h2>' +
        '<p class="muted">Drop in a specification and get back a numbered compliance matrix with the ' +
        'formatting already done. Where your knowledge graph can answer a clause, it does — and says ' +
        'which approved node the answer came from. Where it cannot, it says so and raises the gap ' +
        'for review rather than inventing a number.</p>' +
        '<div class="hero__actions">' +
        '<a class="btn btn--primary" href="/tools/compliance-maker/">Convert a spec</a>' +
        '</div></div>' +
        '<ol class="steps">' + steps.map(function (s) {
          return '<li><span class="steps__n">' + s[0] + '</span>' +
            '<span class="steps__t">' + esc(s[1]) + '</span>' +
            '<span class="steps__d">' + esc(s[2]) + '</span></li>';
        }).join('') + '</ol></div>';
    }

    function indexHTML(sections) {
      if (!sections.length) return '<div class="empty">No sections are published yet.</div>';
      return sections.map(function (s, i) {
        var n = String(i + 1).padStart(2, '0');
        return '<a class="index-row' + (s.allowed ? '' : ' index-row--locked') + '" href="/s/' + esc(s.slug) + '">' +
          '<span class="index-row__n">' + n + '</span>' +
          '<span class="index-row__main">' +
          '<span class="index-row__title">' + esc(s.title) + '</span>' +
          '<span class="index-row__desc">' + esc(s.description || s.tagline || '') + '</span>' +
          '</span>' +
          '<span class="index-row__meta">' + TN.accessChip(s) + '</span>' +
          '<span class="index-row__go" aria-hidden="true">' + icon('repeat', 18) + '</span>' +
          '</a>';
      }).join('');
    }

    document.addEventListener('tn:ready', function (e) {
      var user = e.detail.user;
      // Middleware redirects a signed-out visitor to /login/, so reaching
      // this page without a user means the session ended between the request
      // and the catalogue call. Send them on rather than rendering an empty
      // shell whose every button will 401.
      if (!user) {
        location.replace('/login/?next=' + encodeURIComponent(location.pathname));
        return;
      }
      TN.el('#hero').innerHTML = heroSignedIn(user);
      TN.el('#feature').innerHTML = featureHTML();
      var node = TN.el('#sections');
      node.removeAttribute('aria-busy');
      node.innerHTML = indexHTML(e.detail.sections || []);
    });
  })();
  </script>
</body>
</html>
