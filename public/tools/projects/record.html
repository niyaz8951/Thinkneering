<!doctype html>
<html lang="en" data-loading>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Specification - Thinkneering Tools</title>
<link rel="icon" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../assets/css/theme.css">
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/hub.js"></script>
<style>
  .rc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .rc-facts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .rc-progress { display: flex; height: 3px; border-radius: 2px; background: var(--surface-2); overflow: hidden; flex: 1 0 100%; margin: 0 2px -2px; }
  .rc-progress i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; } .rc-progress i.ai { background: var(--brand-sky); }
  /* one line that says what the colours mean */
  .rc-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 4px; font-size: 13px; color: var(--text-soft); }
  .rc-legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; background: var(--surface-2); }
  .rc-legend .lg-lib::before { background: var(--ok); } .rc-legend .lg-ai::before { background: var(--brand-sky); } .rc-legend .lg-own::before { background: var(--text-soft); }
  @media (max-width: 640px) { .workbar .count { flex: 1 0 100%; white-space: normal; order: 9; } #rc-mode { display: none; } }
  .rc th:nth-child(1) { width: 80px; } .rc th:nth-child(3) { width: 150px; } .rc th:nth-child(4) { width: 17%; } .rc th:nth-child(5) { width: 13%; } .rc th:nth-child(6) { width: 13%; } .rc th:nth-child(7) { width: 96px; }
  .rc td.tl { white-space: pre-line; font-size: 14px; color: var(--warn); }
  /* a notes column with nothing in it, that this person cannot write in, gives its room to the specification */
  @media (min-width: 861px) {
    .rc.no-tl th:nth-child(5), .rc.no-ic th:nth-child(6) { width: 0; padding-left: 0; padding-right: 0; font-size: 0; overflow: hidden; }
    .rc.no-tl td[data-label="TL Review"], .rc.no-ic td[data-label="Internal Comments"] { padding-left: 0; padding-right: 0; }
  }
  .rc tr.lib .input { background: var(--ok-bg); }
  .rc tr.lib td.read { color: var(--ok); }
  /* an AI draft: blue until a person edits or keeps it */
  .rc tr.ai .input { background: color-mix(in srgb, var(--brand-sky) 18%, var(--surface)); }
  .rc tr.ai td.read { color: var(--brand-strong); }
  .rc .state.ai { color: var(--brand-strong); }
  :root[data-theme="dark"] .rc tr.ai td.read, :root[data-theme="dark"] .rc .state.ai { color: var(--brand-sky); }
  .rc-ai-wrap { display: inline-flex; gap: 6px; }
  .rc .state.err { color: var(--danger); }
  /* review priority of an AI draft (where the reviewer looks): written as a word, colour only as a help */
  .rc .prio { display: inline-block; margin-right: 6px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .02em; border: 1px solid currentColor; }
  .rc .prio.red { color: var(--danger); } .rc .prio.amber { color: var(--warn); } .rc .prio.green { color: var(--ok); }
  .mode-seg { flex: 0 0 auto; } .mode-seg .tab { min-width: 64px; }
  .rc-sheet { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rc-chip { display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; font: inherit; font-size: 13px; text-align: left; cursor: pointer;
             padding: 3px 10px; border-radius: 999px; color: var(--text); background: color-mix(in srgb, var(--brand) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); }
  .rc-chip b { font-weight: 650; color: var(--brand); } .rc-chip span { overflow-wrap: anywhere; }
  .rc-chip:hover { border-color: var(--brand); }
  .rc-tools { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 4px; }
  .rc-tool { font: inherit; font-size: 12px; font-weight: 600; color: var(--brand); background: none; border: 0; padding: 2px 0; cursor: pointer; }
  .rc-tool:hover, .rc-tool:focus-visible { text-decoration: underline; }
  .rc-split { max-width: 760px; width: 100%; }
  .hub-sheet.rc-split textarea.input { min-height: 220px; max-height: 56vh; resize: vertical; line-height: 1.5; }
  #rc-name, .rc-facts .badge { overflow-wrap: anywhere; white-space: normal; }       /* a long file name without spaces must not widen the page on a phone */
  .rc td.rc-sec { padding-top: 6px; padding-bottom: 6px; }
  .rc-sec select.input { width: auto; max-width: 100%; min-height: 34px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
  .rc .input.unsaved { border-color: var(--danger); }
  .rc-notes { margin: 0 0 12px; } .rc-notes .hint { margin: 0 0 2px; }
</style>
</head>
<body>
<header id="topbar"></header>
<main class="page wide">
  <div id="rc-loading"></div>
  <div class="empty" id="rc-error" role="alert" hidden></div>

  <div id="rc-main" hidden>
    <div class="page-head" style="margin-bottom:14px">
      <h1 id="rc-name"></h1>
      <div class="rc-facts" id="rc-facts"></div>
    </div>

    <!-- the work bar: stays under the top bar, slides away while reading down, comes back on the way up -->
    <div class="workbar" id="rc-workbar">
      <select class="input" id="rc-show" aria-label="Show">
        <option value="all">All rows</option>
        <option value="open">To fill</option>
        <option value="filled">Filled</option>
        <option value="review">Waiting for review</option>
        <option value="ai">AI drafts</option>
        <option value="check">To review: RED and AMBER</option>
      </select>
      <input class="input grow" id="rc-q" type="search" placeholder="Find a word in the specification" aria-label="Find" autocomplete="off">
      <span class="count" id="rc-count" role="status"></span>
      <div class="tabs mode-seg" id="rc-seg" role="group" aria-label="Read or edit"><button type="button" class="tab" data-mode="read" aria-selected="true">Read</button><button type="button" class="tab" data-mode="edit" aria-selected="false">Edit</button></div>
      <button type="button" class="btn dock-hide" id="rc-focus">Focus mode</button>
      <span class="more-items">
        <button type="button" class="btn ghost" id="rc-download" title="The file for the consultant: Sr, Specifications, Compliance, Remarks. AI drafts nobody checked are left blank.">Download Excel</button>
        <button type="button" class="btn ghost" id="rc-download-work" title="Your working copy: AI reasons, review priority, colours and the datasheet rows.">Download working Excel</button>
        <span class="rc-ai-wrap" id="rc-ai-wrap" hidden><button type="button" class="btn ghost" id="rc-ai">AI review</button><button type="button" class="btn ghost danger" id="rc-ai-clear" hidden>Remove AI drafts</button></span>
      </span>
      <button type="button" class="btn ghost more-btn" id="rc-more">More</button>
      <div class="rc-progress" aria-hidden="true"><i id="rc-bar"></i><i class="ai" id="rc-bar-ai"></i></div>
    </div>

    <div class="rc-notes">
      <p class="rc-legend" id="rc-legend"><span class="lg-lib">Green: company library</span><span class="lg-ai">Blue: AI draft, check it</span><span class="lg-own">Plain: answered in this project</span></p>
      <p class="hint" id="rc-mode"></p>
      <p class="hint" id="rc-sheet-note" hidden></p>
      <p class="hint" id="rc-review-note" hidden></p>
      <div class="notice warn" id="rc-factory-warn" role="alert" hidden></div>
    </div>
    <div class="empty" id="rc-empty" hidden></div>
    <div class="table-wrap sheet-wrap" id="rc-wrap">
      <table class="table sheet rc" id="rc-table">
        <thead><tr><th>Sr</th><th>Specifications</th><th>Compliance</th><th>Remarks</th><th>TL Review</th><th>Internal Comments</th><th></th></tr></thead>
        <tbody id="rc-body"></tbody>
      </table>
    </div>
    <datalist id="rc-words"><option value="Comply"><option value="Comply with Remarks"><option value="Noted"><option value="Not Comply"><option value="Not Applicable"><option value="In Contractor's Scope"></datalist>
  </div>
</main>

<script src="../compliance-maker/cm-highlight.js"></script>
<script src="../compliance-maker/cm-focus.js"></script>
<script src="../compliance-maker/xlsx-writer.js"></script>
<script src="../compliance-maker/cm-rows.js"></script>
<script src="../compliance-maker/cm-engine.js"></script>
<script src="pr-xlsx.js"></script>
<script src="pr-options.js"></script>
<script src="pr-match.js"></script>
<script>
(function () {
  "use strict";
  var el = Hub.el, $ = function (id) { return document.getElementById(id); };
  var runId = Hub.param("run"), run = null, lines = [], editing = false, match = null, sheetOf = {};

  function when(iso) { var d = new Date(iso); return isNaN(d) ? "" : Hub.date(iso); }
  function bare(name) { return String(name || "").replace(/\.[A-Za-z0-9]{1,5}$/, "") || "Pasted text"; }
  // what the row holds now: the project's own answer, or the library's
  function shown(l) { return l.own ? { c: l.compliance, r: l.remarks } : { c: l.lib_compliance, r: l.lib_remarks }; }
  function filled(l) { var s = shown(l); return !!(s.c || s.r); }
  function stateText(l) {
    if (!l.own) return filled(l) ? "From the library" : "";
    if (l.ai_draft) return "AI draft, check it";                // the reason and confidence are the visible line under the clause
    return l.review === "pending" ? "Saved, in review" : l.review === "approved" ? "Saved, approved" : l.review === "rejected" ? "Saved, project only" : "Saved";
  }

  /* The numbers say what they count: answered (by a person or the library), AI drafts still to check, waiting for review. */
  function counts() {
    var can = lines.filter(function (l) { return l.can; }), drafts = can.filter(function (l) { return l.ai_draft; }).length;
    var done = can.filter(filled).length - drafts, rev = can.filter(function (l) { return l.own && l.review === "pending"; }).length;
    $("rc-count").textContent = done + " of " + can.length + " clauses answered" + (drafts ? ", " + drafts + (drafts === 1 ? " AI draft" : " AI drafts") + " to check" : "") + (rev ? ", " + rev + " waiting for review" : "") + ".";
    $("rc-bar").style.width = (can.length ? Math.round(100 * done / can.length) : 0) + "%";
    $("rc-bar-ai").style.width = (can.length ? Math.round(100 * drafts / can.length) : 0) + "%";
    if (run) reviewNote();
  }
  /* An AI draft says why, in one visible line (hover does not exist on a phone). */
  var PRIO = { red: "RED", amber: "AMBER", green: "GREEN" };
  function prio(l) { return l.ai_draft && l.ai && PRIO[l.ai.priority] ? l.ai.priority : l.ai_draft ? "amber" : ""; }
  function why(l) {
    if (!l.ai_draft) return null;
    var a = l.ai || {}, conf = a.confidence ? a.confidence + " confidence" : "", p = prio(l);
    return el("span", { "class": "why" }, [p ? el("span", { "class": "prio " + p, text: PRIO[p] }) : null, el("b", { text: "AI draft" + (conf ? ", " + conf : "") }), a.reason ? " \u2014 " + a.reason : ""]);
  }
  /* What the reviewer has to look at (master prompt v4.1: review RED and AMBER only), and the precedent:
     the earlier record that shares the most identical clauses with this one. */
  function reviewNote() {
    var box = $("rc-review-note"), d = lines.filter(function (l) { return l.ai_draft; }), n = { red: 0, amber: 0, green: 0 };
    d.forEach(function (l) { n[prio(l)]++; });
    var parts = [];
    if (d.length) parts.push("AI drafts: " + n.red + " RED, " + n.amber + " AMBER, " + n.green + " GREEN. Review RED (" + n.red + ") and AMBER (" + n.amber + ") only: choose \u201cTo review\u201d above.");
    var pc = run.precedent;
    if (pc) parts.push("Precedent: " + (pc.project ? pc.project + (pc.file_name ? " (" + bare(pc.file_name) + ")" : "") : "an earlier record of another project") + " has " + pc.same + " of these " + pc.clauses + " clauses word for word, " + pc.answered + " of them answered by people.");
    box.textContent = parts.join(" ");
    box.hidden = !parts.length;
  }

  // sent with every write: the database refuses it when the row with this number is no longer this clause
  // (someone split or joined rows since the page was opened)
  function rowKey(l) { return String(l.spec || "").toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 40); }
  /* Save one clause. Back to exactly the library answer, or both boxes emptied: no own answer is kept. */
  function saveLine(l, c, r) {
    var same = c === l.lib_compliance && r === l.lib_remarks;
    return Api.prRunSaveLine(Hub.token(), { run: runId, seq: l.seq, compliance: same ? "" : c, remarks: same ? "" : r, check: rowKey(l) }).then(function (res) {
      l.own = !same && !!(c || r); l.compliance = l.own ? c : ""; l.remarks = l.own ? r : ""; l.review = res.review || "";
      l.ai_draft = false; l.ai = null;                         // a person has now stood behind this row
    });
  }

  /* Full screen, one clause at a time (cm-focus.js). Opens on the first clause still to fill. */
  function focusMode() {
    var part = "", sect = "", items = [];
    lines.forEach(function (l) {
      if (l.type === "part") { part = l.spec; sect = ""; return; }
      if (l.type === "section") { sect = (l.sr ? l.sr + " " : "") + l.spec; return; }
      if (!l.can) return;
      var s = shown(l);
      items.push({ line: l, part: part, section: sect, sr: l.sr, spec: l.spec, compliance: s.c, remarks: s.r, info: l.ai_draft ? "" : stateText(l), lib: !l.own && filled(l),
                   draft: l.ai_draft ? { reason: (l.ai && l.ai.reason) || "", confidence: (l.ai && l.ai.confidence) || "" } : null,
                   comments: run.can_comment ? l.lib_comments || "" : undefined,
                   review: l.tl_review || "", canReview: !!run.can_review,       // a box for the people who may write them, a line of text for everyone else
                   others: (l.lib_comments && !run.can_comment ? ["Internal comment · " + l.lib_comments] : []).concat((sheetOf[lines.indexOf(l)] || []).map(function (d) { return "Datasheet · " + d.component + ": " + valueText(d.cells); })) });
    });
    // Opens where the user is: the clause at the top of the window once he has scrolled into the
    // specification, otherwise the first clause still to fill.
    var first = 0, k; for (k = 0; k < items.length; k++) if (!filled(items[k].line)) { first = k; break; }
    var seen = topLine();
    if (seen) for (k = 0; k < items.length; k++) if (lines.indexOf(items[k].line) >= lines.indexOf(seen)) { first = k; break; }
    CMFocus.open({ title: bare(run.file_name), items: items, start: first, choices: CHOICES,
      editing: editing, onMode: function (on) { setMode(on, true); },      // one mode for the page and the pane
      suggest: function (it) { return proposal(items, it); },
      save: function (it, v) {
        var now = shown(it.line), answer = v.compliance === now.c && v.remarks === now.r ? Promise.resolve() : saveLine(it.line, v.compliance, v.remarks);
        var note = v.comments === undefined || v.comments === (it.line.lib_comments || "") ? Promise.resolve()
          : Api.prRunSaveComment(Hub.token(), { run: runId, seq: it.line.seq, comments: v.comments, check: rowKey(it.line) }).then(function () { it.line.lib_comments = v.comments; it.comments = v.comments; });
        var tl = v.review === undefined || v.review === (it.line.tl_review || "") ? Promise.resolve()
          : Api.prRunSaveReview(Hub.token(), { run: runId, seq: it.line.seq, text: v.review, check: rowKey(it.line) }).then(function () { it.line.tl_review = v.review; it.review = v.review; });
        return Promise.all([answer, note, tl]).then(function () {
          // a new answer can change the proposals for the clauses after it (same clause again, same section)
          Object.keys(proposals).forEach(function (q) { if (+q !== it.line.seq) delete proposals[q]; });
          var s = shown(it.line); it.compliance = s.c; it.remarks = s.r; it.lib = !it.line.own && filled(it.line); it.info = stateText(it.line);
          if (!it.line.ai_draft) it.draft = null;
          return { info: it.line.own && it.line.review === "pending" ? "sent for review" : "", lib: it.lib };
        });
      },
      onClose: function () { counts(); draw(); } });
  }
  /* Focus mode proposals (ai_suggest): asked for the clause on screen and the next two that may need one, in one
     call, and kept per clause while the page is open, so Next shows the proposal at once. A saved answer drops the
     clause from the cache (its proposal is no longer needed; others may change with it, so they are asked again). */
  var proposals = {};
  function wantsProposal(it) { var l = it.line; return !l.ai_draft && !(l.own && filled(l)); }
  function proposal(items, it) {
    var seq = it.line.seq;
    if (proposals[seq]) return proposals[seq];
    var k = items.indexOf(it), batch = [it];
    for (var j = k + 1; j < items.length && batch.length < 3; j++) if (wantsProposal(items[j]) && !proposals[items[j].line.seq]) batch.push(items[j]);
    var call = Api.aiSuggest(Hub.token(), runId, batch.map(function (x) { return x.line.seq; })).then(function (res) {
      var by = {}; (res.suggestions || []).forEach(function (x) { by[x.seq] = x; });
      if (res.off) return {};
      if (res.model_note && !proposal.told) { proposal.told = true; Hub.toast(res.model_note); }
      return by;
    }, function () { batch.forEach(function (x) { delete proposals[x.line.seq]; }); return {}; });
    batch.forEach(function (x) { proposals[x.line.seq] = call.then(function (by) { return by[x.line.seq] || null; }); });
    return proposals[seq];
  }
  function topLine() {
    var wrap = $("rc-wrap").getBoundingClientRect();
    if (wrap.top > 0) return null;                              // the table has not reached the top of the window yet
    var stick = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hub-stick")) || 0, edge = stick + 44, rows = $("rc-body").children;
    // the first clause that starts in view; a long clause that fills the window counts when none does
    var part = null;
    for (var n = 0; n < rows.length; n++) {
      if (!rows[n]._line) continue;
      var box = rows[n].getBoundingClientRect();
      if (box.top >= edge - 6) return box.top < window.innerHeight - 40 ? rows[n]._line : part;
      if (box.bottom > edge + 40) part = rows[n]._line;
    }
    return part;
  }
  var chipsDue = false;
  $("rc-body").addEventListener("focusout", function () {
    if (!chipsDue) return;
    setTimeout(function () { var a = document.activeElement; if (chipsDue && !(a && $("rc-body").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) { chipsDue = false; settled().then(draw); } }, 300);
  });
  var CHOICES = ["Comply", "Comply with Remarks", "Noted", "Not Comply", "Not Applicable", "In Contractor's Scope"];

  /* In Edit a clause is first drawn as text and gets its boxes when it comes near the window (Hub.lazyRows). */
  var lazy = Hub.lazyRows(function (tr) { return row(tr._line, true); });
  function row(l, boxes) {
    if (l.type === "part") return el("tr", { "class": "part" }, [el("td", { "class": "sr" }), el("td", { colspan: "6", text: l.spec })]);
    if (l.type === "section") {
      // a heading has no answer of its own; in Edit it can give one answer to every clause under it
      var pick = editing ? sectionPick(l) : null;
      var head = el("tr", { "class": "sect" }, [el("td", { "class": "sr", text: l.sr }), el("td", { colspan: pick ? "1" : "6", text: l.spec }), pick ? el("td", { colspan: "5", "class": "rc-sec" }, [pick]) : null]);
      head._line = l; head._fixed = true;
      return head;
    }
    var text = el("div", { "class": "spec" }, CMHighlight.runs(l.spec).map(function (r) { return r.style ? el("span", { "class": "hl-" + r.style, text: r.text }) : r.text; }));
    var kind = l.type === "letter" && /^[A-Z]/.test(l.sr || "") ? "letter" : l.type === "number" ? "number" : "";
    if (!l.can) {            // too short to answer; in Edit it can still be split or joined
      var bare = el("tr", { "class": "line" }, [el("td", { "class": "sr " + kind, text: l.sr }), el("td", { colspan: editing ? "5" : "6" }, [text]), editing ? el("td", { "class": "end" }, [tools(l)]) : null]);
      bare._line = l; bare._fixed = true;
      return bare;
    }

    var s = shown(l), sheet = sheetOf[lines.indexOf(l)] || [];
    // what the datasheet has for the rows this clause is about (found by the row keywords)
    var chips = sheet.length ? el("div", { "class": "rc-sheet" }, sheet.map(function (d) {
      return el("button", { type: "button", "class": "rc-chip", title: "From the datasheet. Press to see what the factory offers for this row.", onclick: function () {
        PROptions.open({ productId: run.product_id, product: run.product, factory: match.factory, key: d.key, section: d.section, component: d.component, values: d.cells });
      } }, [el("b", { text: d.component }), el("span", { text: valueText(d.cells) })]);
    })) : null;
    var state = el("span", { "class": "state" + (l.ai_draft ? " ai" : ""), text: stateText(l) }), reason = why(l);
    var rowClass = !l.own && filled(l) ? " lib" : l.ai_draft ? " ai" : "";

    // read: plain text, so the page can be searched (Ctrl+F) and read like the document
    if (!editing || (!boxes && lazy.on)) {
      var plain = el("tr", { "class": "line" + rowClass }, [
        el("td", { "class": "sr " + kind, text: l.sr }), el("td", {}, [text, reason, chips]),
        el("td", { "class": "read", "data-label": "Compliance", text: s.c }), el("td", { "class": "read", "data-label": "Remarks", text: s.r }),
        el("td", { "class": "tl", "data-label": "TL Review", text: l.tl_review || "" }),
        el("td", { "class": "note", "data-label": "Internal Comments", text: l.lib_comments || "" }),
        el("td", { "class": "end" }, stateText(l) ? [state] : [])
      ]);
      plain._line = l;
      if (editing) lazy.watch(plain);
      return plain;
    }
    var comp = el("input", { "class": "input", value: s.c, maxlength: "200", list: "rc-words", "aria-label": "Compliance" });
    var rem = el("textarea", { "class": "input", rows: "1", maxlength: "4000", "aria-label": "Remarks" }); rem.value = s.r; Hub.autoGrow(rem);
    var tr = el("tr", { "class": "line edit" + rowClass }, [
      el("td", { "class": "sr " + kind, text: l.sr }), el("td", {}, [text, reason, chips]), el("td", { "data-label": "Compliance" }, [comp]), el("td", { "data-label": "Remarks" }, [rem]),
      run.can_review ? el("td", { "data-label": "TL Review" }, [reviewBox(l)]) : el("td", { "class": "tl", "data-label": "TL Review", text: l.tl_review || "" }),
      run.can_comment ? el("td", { "data-label": "Internal Comments" }, [commentBox(l)]) : el("td", { "class": "note", "data-label": "Internal Comments", text: l.lib_comments || "" }),
      el("td", { "class": "end" }, [state, tools(l)])
    ]);
    tr._line = l;
    // Enter in Compliance goes to the next clause, so a run of answers is typed without the mouse
    comp.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      var nx = tr.nextElementSibling;

    var open = lines.filter(function (l) { return l.can && !filled(l); }).length, drafts = lines.filter(function (l) { return l.ai_draft; }).length;
    var replace = false, n = open, ask;
    if (!open && !drafts) { Hub.tell("Every clause already shows an answer, from a person or from the library.", { title: "Nothing to draft" }); return; }
    if (!open) { replace = true; n = drafts; ask = Hub.confirm("Every clause shows an answer; " + drafts + " of them are AI drafts. Draft those " + drafts + " again? Answers typed by people and answers from the library are never touched.", { title: "Draft the AI answers again?", ok: "Draft again" }); }
    else ask = Hub.confirm("The AI drafts an answer for the " + open + (open === 1 ? " clause" : " clauses") + " that show no answer yet: from this project's datasheet first, then Product Options, the library, earlier answers and the AI rules; the AI model only where none of them settles a clause. Library answers this project's datasheet contradicts are drafted again from the datasheet. Drafts are blue; nothing goes to the library until a person checks them. Answers people gave are never changed.", { title: "Draft answers with AI?", ok: "Start" });
    ask.then(function (yes) {
      if (!yes) return;
      aiRun(replace, n);
    });
  }

  /* The review runs inside a window that holds the screen until it is over and the person presses OK:
     nothing else can be changed on the record meanwhile (a person's edit would race the drafts). It checks
     the AI first with one tiny call, then drafts in batches of 10, and says plainly why it stopped. */
  function aiRun(replace, n) {
    aiBusy = true; $("rc-ai").disabled = true; $("rc-ai-clear").disabled = true;
    var stop = false, done = 0, drafted = 0, copied = 0, ruled = 0, sheet = 0, failed = 0, waiting = 0, errors = [], skip = [], since = null, t0 = Date.now(), sheetWarn = "";
    var title = el("h2", { text: "AI review" });
    var status = el("p", { text: "Checking the AI connection…" });
    var bar = el("div", { "class": "meter2", style: "height:8px" }, [el("i", { "class": "ai" })]);
    var counts = el("p", { "class": "hub-sheet-hint", text: "" });
    var note = el("div", { "class": "notice", hidden: true, style: "white-space:pre-line" });
    var btnStop = el("button", { type: "button", "class": "btn ghost", text: "Stop" });
    var btnOk = el("button", { type: "button", "class": "btn", text: "OK", hidden: true });
    var box = el("div", { "class": "hub-sheet", role: "alertdialog", "aria-modal": "true", "aria-label": "AI review", "aria-live": "polite" },
      [title, status, bar, counts, note, el("div", { "class": "hub-sheet-actions" }, [btnStop, btnOk])]);
    var back = el("div", { "class": "hub-sheet-back" }, [box]);
    // no Esc, no click outside, no drag: only OK closes it
    function swallow(e) { if (e.key === "Escape" || e.key === "Tab" && !box.contains(e.target)) { e.preventDefault(); e.stopPropagation(); } }
    function leaving(e) { e.preventDefault(); e.returnValue = ""; }
    document.addEventListener("keydown", swallow, true);
    window.addEventListener("beforeunload", leaving);
    document.body.appendChild(back);
    btnStop.focus();
    btnStop.addEventListener("click", function () { stop = true; btnStop.disabled = true; btnStop.textContent = "Stopping after this batch…"; });
    btnOk.addEventListener("click", function () {
      document.removeEventListener("keydown", swallow, true);
      back.remove();
      aiBusy = false; $("rc-ai").disabled = false; $("rc-ai-clear").disabled = false;
      reload();
    });
    function paint() {
      bar.firstChild.style.width = (n ? Math.min(100, Math.round(done / n * 100)) : 0) + "%";
      var parts = [];
      if (sheet) parts.push(sheet + " from the project's datasheet");
      if (copied) parts.push(copied + " from the library or earlier answers");
      if (ruled) parts.push(ruled + " by AI rules");
      if (drafted) parts.push(drafted + " by the AI");
      if (failed) parts.push(failed + " could not be drafted (left empty)");
      if (waiting) parts.push(waiting + " left for a person (no source on file, model off or budget used)");
      counts.textContent = parts.join(" · ");
    }
    function finish(headline, message, kind) {
      window.removeEventListener("beforeunload", leaving);
      title.textContent = headline;
      var mins = Math.round((Date.now() - t0) / 60000);
      status.textContent = done + " of " + n + (n === 1 ? " clause" : " clauses") + " drafted" + (mins ? " in about " + mins + (mins === 1 ? " minute" : " minutes") : "") + ". Drafts are blue on the record: check them before sending.";
      if (message) { note.textContent = message; note.className = "notice" + (kind ? " " + kind : ""); note.hidden = false; }
      paint();
      btnStop.hidden = true; btnOk.hidden = false; btnOk.focus();
    }
    var noModel = false, modelNote = "";
    Api.aiCheck(Hub.token()).then(function (c) {
      // without the model the review still answers from the datasheet, the library, earlier answers and the rules
      if (!c.working) { noModel = true; modelNote = (c.message || "The AI model did not answer.") + " The review goes on without the model."; }
      function step() {
        status.textContent = "Drafting… " + done + " of " + n + (n === 1 ? " clause" : " clauses") + ". Keep this page open.";
        paint();
        return Api.aiReviewRun(Hub.token(), { run: runId, limit: 12, replace: replace, since: since, skip: skip, noModel: noModel }).then(function (res) {
          since = res.since || since; done += res.done || 0; failed += res.failed || 0;
          skip = skip.concat(res.failed_seqs || []);
          drafted += res.drafted || 0; copied += res.copied || 0; ruled += res.ruled || 0; sheet += res.from_datasheet || 0; waiting += res.waiting || 0;
          if (res.warning) sheetWarn = res.warning;
          (res.errors || []).forEach(function (x) { if (errors.length < 3) errors.push(x); });
          if (res.stopped) return { why: res.stopped };
          if (stop) return { why: "Stopped by you. Press AI review again to go on with the rest." };
          if (res.remaining > 0) return step();            // failed clauses are skipped next time, so this ends
          return null;
        });
      }
      return step().then(function (end) {
        var detail = (sheetWarn ? sheetWarn + "\n\n" : "") + (modelNote ? modelNote + "\n\n" : "") + (errors.length ? "Not drafted, for example:\n" + errors.join("\n") : "");
        if (end) finish(done ? "AI review stopped" : "AI review could not draft", end.why + (detail ? "\n\n" + detail : ""), done ? "warn" : "error");
        else if (!done && failed) finish("AI review could not draft", detail, "error");
        else finish("AI review finished", detail || "", detail ? "warn" : "ok");
      });
    })["catch"](function (err) {
      finish("AI review stopped", (err && err.message) || "The AI review stopped.", "error");
    });
  }
  function aiClear() {
    if (aiBusy) return;
    var drafts = lines.filter(function (l) { return l.ai_draft; }).length;
    Hub.confirm("This takes the " + drafts + " AI " + (drafts === 1 ? "draft" : "drafts") + " off this record. Answers typed by people stay.", { title: "Remove the AI drafts?", ok: "Remove drafts", danger: true }).then(function (yes) {
      if (!yes) return;
      return settled().then(function () { return Api.aiReviewClear(Hub.token(), runId); }).then(function (res) { Hub.toast((res.removed || 0) + " AI drafts removed."); return reload(); },
        function (err) { Hub.tell((err && err.message) || "Could not remove the drafts.", { title: "AI review" }); });
    });
  }
  $("rc-ai").addEventListener("click", aiReview);
  $("rc-ai-clear").addEventListener("click", aiClear);
})();
</script>
</body>
</html>
