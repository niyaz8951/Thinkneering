<!doctype html>
<html lang="en" data-loading>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maps - Thinkneering Tools</title>
<link rel="icon" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="maps.css">
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/hub.js"></script>
<script src="../../assets/js/xlsx-lite.js"></script>
</head>
<body>
<header id="topbar"></header>
<main class="page wide" id="mpPage">
  <div class="page-head">
    <h1 id="mpTitle">Maps</h1>
    <p id="mpLead">Knowledge as a growing tree. Open a map, click a branch to open it, and double-click one to read it.</p>
    <p class="small muted" id="mpSub" hidden></p>
  </div>

  <!-- all maps -->
  <section id="mpList">
    <div class="mp-find">
      <input class="input" type="search" id="mpFind" placeholder="Search every map: e.g. IPLV, coil coating" autocomplete="off" aria-label="Search every map">
      <button class="btn" type="button" id="mpNew">Add map</button>
    </div>
    <div class="mp-hits" id="mpHits" hidden></div>
    <div id="mpListState" class="empty">Loading maps…</div>
    <div class="grid" id="mpGrid"></div>
  </section>

  <!-- one map -->
  <section id="mpMap" hidden>
    <div class="card mp-bar">
      <input class="input" type="search" id="mpQ" placeholder="Search this map" autocomplete="off" aria-label="Search this map">
      <div class="tabs" role="tablist" aria-label="View">
        <button class="tab" type="button" role="tab" id="mpViewMap" aria-selected="true">Map</button>
        <button class="tab" type="button" role="tab" id="mpViewOut" aria-selected="false">Outline</button>
      </div>
      <div class="tabs" role="tablist" aria-label="Read or edit" id="mpMode" hidden>
        <button class="tab" type="button" role="tab" id="mpRead" aria-selected="true">Read</button>
        <button class="tab" type="button" role="tab" id="mpEdit" aria-selected="false">Edit</button>
      </div>
      <button class="btn ghost" type="button" id="mpImport" hidden>Import</button>
      <button class="btn ghost" type="button" id="mpExport">Export</button>
      <button class="btn ghost" type="button" id="mpCables" hidden title="Every wire of this map as an Excel list">Cable schedule</button>
      <button class="btn ghost" type="button" id="mpSettings" hidden>Map settings</button>
    </div>
    <div class="mp-meta">
      <nav class="mp-crumbs" id="mpCrumbs" aria-label="Branch path"></nav>
      <div class="mp-pills" id="mpPills"></div>
    </div>
    <div id="mpMapState" class="empty" hidden></div>
    <div class="mp-work" id="mpWork">
      <div class="mp-legend" id="mpLegend" hidden aria-label="What the lines mean"></div>
      <div class="mp-board" id="mpBoard">
        <div class="mp-canvas" id="mpCanvas"><div class="mp-sizer" id="mpSizer"><div class="mp-stage" id="mpStage" role="tree" aria-label="Map"></div></div></div>
        <div class="mp-outline" id="mpOutline" hidden></div>
        <div class="mp-tools" id="mpTools" role="toolbar" aria-label="Map view">
          <button class="mp-tb" type="button" id="mpZoomOut" title="Zoom out (-)" aria-label="Zoom out">−</button>
          <button class="mp-tb mp-pct" type="button" id="mpZoomPct" title="Back to 100% (0)">100%</button>
          <button class="mp-tb" type="button" id="mpZoomIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
          <button class="mp-tb" type="button" id="mpFit" title="Fit the map on the screen">Fit</button>
          <button class="mp-tb" type="button" id="mpFlow" aria-pressed="true" hidden title="Moving dots along the power lines that have supply">Flow</button>
          <button class="mp-tb" type="button" id="mpReset" hidden title="Undo every Isolate / Reconnect you tried">Reset simulation</button>
          <button class="mp-tb" type="button" id="mpXlinks" aria-pressed="true" hidden title="Lines between linked branches: the chosen branch's, all, or none (press to change)"><span id="mpXlinksTxt">Links: chosen</span></button>
          <button class="mp-tb" type="button" id="mpSpecial" aria-pressed="false" title="Show the special notes under every branch">Special notes</button>
          <button class="mp-tb mp-fullbtn" type="button" id="mpFull" aria-pressed="false" title="Full screen (F)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg><span id="mpFullTxt">Full screen</span></button>
        </div>
        <p class="mp-hint" id="mpHint"></p>
      </div>
    </div>
    <div class="mp-note-back" id="mpNoteBack" hidden><article class="mp-note" id="mpNote" tabindex="-1" role="dialog" aria-modal="true" aria-label="Branch"></article></div>
  </section>
</main>
<script src="mp-signs.js"></script>
<script src="mp-water.js"></script>
<script src="maps.js"></script>
</body>
</html>
