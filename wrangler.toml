name = "thinkneering"
pages_build_output_dir = "."
compatibility_date = "2025-11-01"

[[d1_databases]]
binding = "DB"
database_name = "thinkneering-db"
database_id = "a5ea0be2-8f86-4e78-b786-571e66301f0b"

# Workers AI: the dictionary and every KEPT AI feature. Everything else works
# without it; those features answer "AI binding not configured" instead.
# (Local `wrangler pages dev` needs CLOUDFLARE_API_TOKEN for this binding;
# comment it out temporarily to run the site offline.)
[ai]
binding = "AI"