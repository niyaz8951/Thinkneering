# Thinkneering Hub - one Worker: the static site (public/) and the API (worker/src).
# No account id or zone id here: they come from `wrangler login` (or the Workers Builds connection).
# Secrets (`wrangler secret put` or the dashboard): SESSION_SECRET, AI_GATEWAY_TOKEN.

name = "thinkneering-hub"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/"]

[vars]
ENV_NAME = "local"
AI_GATEWAY_ID = "hub"

[[d1_databases]]
binding = "DB"
database_name = "thinkneering-db"
database_id = "829bac8e-1bc2-45e9-b5d8-9fe88f233a44"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "hub-files"

[[vectorize]]
binding = "VECTORS"
index_name = "hub-vectors"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *", "30 2 * * *"]

[observability]
enabled = true

# ---------- staging: its own database, bucket and index ----------
[env.staging]
name = "thinkneering-hub-staging"
routes = [{ pattern = "staging.tools.thinkneering.com", custom_domain = true }]

[env.staging.vars]
ENV_NAME = "staging"
AI_GATEWAY_ID = "hub"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "thinkneering-db-staging"
database_id = "replace-with-the-staging-database-id-when-staging-is-created"
migrations_dir = "db/migrations"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "hub-files-staging"

[[env.staging.vectorize]]
binding = "VECTORS"
index_name = "hub-vectors-staging"

[env.staging.ai]
binding = "AI"

[env.staging.triggers]
crons = ["*/5 * * * *", "30 2 * * *"]

# ---------- production ----------
[env.production]
name = "thinkneering-hub"
routes = [{ pattern = "tools.thinkneering.com", custom_domain = true }]

[env.production.vars]
ENV_NAME = "production"
AI_GATEWAY_ID = "hub"

[[env.production.d1_databases]]
binding = "DB"
database_name = "thinkneering-db"
database_id = "829bac8e-1bc2-45e9-b5d8-9fe88f233a44"
migrations_dir = "db/migrations"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "hub-files"

[[env.production.vectorize]]
binding = "VECTORS"
index_name = "hub-vectors"

[env.production.ai]
binding = "AI"

[env.production.triggers]
crons = ["*/5 * * * *", "30 2 * * *"]

# ---------- local, offline: no AI and no Vectorize binding, so `wrangler dev --env local` runs without a
# Cloudflare login (AI review then says it is not available here). `npm run dev` uses the top-level
# bindings, where AI calls go to Workers AI through your login.
[env.local]
name = "thinkneering-hub-local"

[env.local.vars]
ENV_NAME = "local"
AI_GATEWAY_ID = "hub"
AI_FAKE = "1"

[[env.local.d1_databases]]
binding = "DB"
database_name = "thinkneering-db"
database_id = "829bac8e-1bc2-45e9-b5d8-9fe88f233a44"
migrations_dir = "db/migrations"

[[env.local.r2_buckets]]
binding = "FILES"
bucket_name = "hub-files"
