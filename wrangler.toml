name = "thinkneering"
pages_build_output_dir = "."
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "thinkneering-db"
database_id = "cac87d3e-c9c0-4d20-978c-58a859df95ea"

# Workers AI. Required by the Compliance Maker's clause review and datasheet
# extraction; every other part of the site works without it. Both features
# degrade rather than break when it is missing — datasheet extraction falls
# back to pattern matching, which is the "AI binding not configured" notice.
[ai]
binding = "AI"

# The Education library. This bucket IS the book list: /api/education/library
# calls .list() on it, so uploading a file makes it appear and deleting one
# makes it vanish, with no manifest to edit and no deploy in between.
#
# Books are deliberately NOT in the repo. A file under /books/ would be a
# public download for anyone who guessed the name; an object in here can only
# be reached through the API, which checks admin approval first.
[[r2_buckets]]
binding = "BOOKS"
bucket_name = "thinkneering-books"

# Optional, only needed once you want to upload book cover images from the
# admin panel instead of pasting URLs. Ask before wiring this up.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "thinkneering-media"
