# Thinkneering
# One Worker serving both static assets and API

name = "thinkneering"
main = "worker/src/index.ts"

compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/"]

[vars]
ENV_NAME = "local"
AI_GATEWAY_ID = "thinkneering"

[[d1_databases]]
binding = "DB"
database_name = "thinkneering-db"
database_id = "829bac8e-1bc2-45e9-b5d8-9fe88f233a44"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "hub-files"

[[vectorize]]
binding = "VECTORS"
index_name = "hub-vectors"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *", "30 2 * * *"]

[observability]
enabled = true

# =========================================================
# STAGING
# =========================================================

[env.staging]
name = "thinkneering-staging"
routes = [
  { pattern = "staging.tools.thinkneering.com", custom_domain = true }
]

[env.staging.vars]
ENV_NAME = "staging"
AI_GATEWAY_ID = "thinkneering"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "thinkneering-db-staging"
database_id = "replace-with-the-staging-database-id"
migrations_dir = "db/migrations"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "hub-files-staging"

[[env.staging.vectorize]]
binding = "VECTORS"
index_name = "hub-vectors-staging"

[env.staging.ai]
binding = "AI"

[env.staging.triggers]
crons = ["*/5 * * * *", "30 2 * * *"]

# =========================================================
# PRODUCTION
# =========================================================

[env.production]
name = "thinkneering"
routes = [
  { pattern = "tools.thinkneering.com", custom_domain = true }
]

[env.production.vars]
ENV_NAME = "production"
AI_GATEWAY_ID = "thinkneering"

[[env.production.d1_databases]]
binding = "DB"
database_name = "thinkneering-db"
database_id = "829bac8e-1bc2-45e9-b5d8-9fe88f233a44"
migrations_dir = "db/migrations"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "hub-files"

[[env.production.vectorize]]
binding = "VECTORS"
index_name = "hub-vectors"

[env.production.ai]
binding = "AI"

[env.production.triggers]
crons = ["*/5 * * * *", "30 2 * * *"]

# =========================================================
# LOCAL
# =========================================================

[env.local]
name = "thinkneering-local"

[env.local.vars]
ENV_NAME = "local"
AI_GATEWAY_ID = "thinkneering"
AI_FAKE = "1"

[[env.local.d1_databases]]
binding = "DB"
database_name = "thinkneering-db"
database_id = "829bac8e-1bc2-45e9-b5d8-9fe88f233a44"
migrations_dir = "db/migrations"

[[env.local.r2_buckets]]
binding = "FILES"
bucket_name = "hub-files"